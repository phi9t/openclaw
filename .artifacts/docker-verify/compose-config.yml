name: openclaw
services:
  openclaw-cli:
    entrypoint:
      - node
      - dist/index.js
    environment:
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ""
      CLAUDE_WEB_COOKIE: ""
      CLAUDE_WEB_SESSION_KEY: ""
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: verify-token
      TERM: xterm-256color
    image: openclaw:local
    init: true
    networks:
      default: null
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: /tmp/tmp.eABD3IpeEM/config
        target: /home/node/.openclaw
        bind:
          create_host_path: true
      - type: bind
        source: /tmp/tmp.eABD3IpeEM/workspace
        target: /home/node/.openclaw/workspace
        bind:
          create_host_path: true
  openclaw-gateway:
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - loopback
      - --port
      - "18789"
      - --tailscale
      - serve
    environment:
      CLAUDE_AI_SESSION_KEY: ""
      CLAUDE_WEB_COOKIE: ""
      CLAUDE_WEB_SESSION_KEY: ""
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: verify-token
      TERM: xterm-256color
    image: openclaw:local
    init: true
    network_mode: host
    ports:
      - mode: ingress
        target: 18789
        published: "18789"
        protocol: tcp
      - mode: ingress
        target: 18790
        published: "18790"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /tmp/tmp.eABD3IpeEM/config
        target: /home/node/.openclaw
        bind:
          create_host_path: true
      - type: bind
        source: /tmp/tmp.eABD3IpeEM/workspace
        target: /home/node/.openclaw/workspace
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
        bind:
          create_host_path: true
networks:
  default:
    name: openclaw_default
